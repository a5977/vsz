<div id="overlay"><div class="modal" id="modal"></div></div><script>'use strict';

for(let i=0;i<280;i++)stars.push({x:Math.random(),y:Math.random()*.86,r:Math.random()*1.4+.2,a:Math.random()*.7+.2});

function intro(){modal('<div class="eyebrow">DEEP SPACE / SURVIVAL TEST</div><h1>VOID<br>RUNNER<span style="color:#73f7e8">.</span></h1><p class="intro">다가오는 적을 피하고, 성장하고, 끝내 살아남으세요.</p><p>중간보스 2마리와 최종보스를 격파하세요.<br>탑뷰로 전장을 확인하세요. 주황색 사격 적의 붉은 탄환을 피하세요.</p><div class="instructions"><span><kbd>W A S D</kbd> 이동</span><span>자동 조준 · 자동 사격</span><span><kbd>SPACE</kbd> 폭탄</span></div><button class="primary" id="start">출격하기 →</button><p style="font-size:10px">PC 키보드 권장 · 시간 제한 없음 · 파괴 시 성장 초기화</p>');$('start').onclick=start}
function start(){player={x:0,z:0,hp:100,maxhp:100,level:1,xp:0,total:0,next:10,bombs:0,damage:CONFIG.damage,interval:CONFIG.shotInterval,inv:0};enemies=[];bullets=[];drops=[];effects=[];time=0;spawnClock=0;shotClock=0;stage=0;kills=0;boss=null;flash=0;hurt=0;keys={};state='play';$('overlay').hidden=true;notify('자동 무장 활성화 · WASD로 이동');for(let i=0;i<5;i++)spawn();hud()}
function spawn(isBoss=false){let a=Math.random()*Math.PI*2,r=37+Math.random()*12;let e={x:player.x+Math.sin(a)*r,z:player.z+Math.cos(a)*r,hp:26+stage*12,maxhp:26+stage*12,r:1.1,speed:3.5+stage*.8,phase:Math.random()*6,boss:isBoss,shooter:!isBoss&&Math.random()<.35,fire:1.6+Math.random(),hit:0};if(isBoss){e.x=player.x;e.z=player.z+40;e.hp=e.maxhp=CONFIG.bossHP[stage];e.r=3.6+stage*.5;e.speed=2.7+stage*.45;boss=e;notify(['중간보스 I · SENTINEL','중간보스 II · REAPER','최종보스 · OBLIVION'][stage]+' 접근');}if(e.shooter){e.hp=e.maxhp=46+stage*14;e.speed=2.8}enemies.push(e)}

function enemyFire(e){let angle=Math.atan2(player.z-e.z,player.x-e.x);for(const offset of e.boss?[-.2,0,.2]:[0])bullets.push({x:e.x,z:e.z,vx:Math.cos(angle+offset)*15,vz:Math.sin(angle+offset)*15,life:5,r:.55,damage:e.boss?15:10});}
function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.z+=b.vz*dt;b.life-=dt;if(Math.hypot(b.x-player.x,b.z-player.z)<b.r+.85){bullets.splice(i,1);if(player.inv<=0){player.hp=Math.max(0,player.hp-b.damage);player.inv=.6;hurt=.45;if(player.hp===0){end(false);return}}}else if(b.life<=0)bullets.splice(i,1)}}
function gain(n){player.xp+=n;player.total+=n}
function defeat(e){if(!enemies.includes(e))return;enemies.splice(enemies.indexOf(e),1);effects.push({type:'burst',x:e.x,z:e.z,t:.5,color:e.boss?'#ff5b9b':'#ffac6f'});gain(e.boss?30:3);if(e.boss){stage++;boss=null;if(stage===3){end(true);return}notify('보스 격파 · 다음 구역 진입')}else{kills++;if(Math.random()<CONFIG.dropChance)drops.push({x:e.x,z:e.z})}}

function levelup(){player.xp-=player.next;player.level++;player.next=Math.round(player.next*1.35+4);state='upgrade';keys={};modal('<div class="eyebrow">SYSTEM UPGRADE / LEVEL '+player.level+'</div><h2>다음 전투를 준비하세요.</h2><p>강화 하나를 선택하세요. 선택하는 동안 전투는 멈춥니다.</p><div class="choices"><button data-up="damage">01 / WEAPON<b>화력 강화</b><small>공격력 +25%</small></button><button data-up="rate">02 / FIRE RATE<b>속사 강화</b><small>공격 간격 −15%</small></button><button data-up="hull">03 / HULL<b>장갑 강화</b><small>최대 체력 +25<br>체력 35 회복</small></button></div>');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>choose(b.dataset.up))}

function pause(){if(state==='play'){state='pause';keys={};modal('<div class="eyebrow">FLIGHT PAUSED</div><h2>비행 일시 정지</h2><p>준비되면 다시 전장으로 돌아가세요.</p><button class="primary" id="resume">계속하기 →</button>');$('resume').onclick=pause}else if(state==='pause'){state='play';$('overlay').hidden=true}}
function end(win){state='end';keys={};modal('<div class="eyebrow">'+(win?'MISSION COMPLETE':'SIGNAL LOST')+'</div><h2>'+(win?'최종보스 격파. 임무 완료!':'우주선이 파괴되었습니다.')+'</h2><p>총획득 경험치</p><div class="resultScore">'+player.total+'</div><p>처치 '+kills+' · 보스 '+stage+'/3 · 비행 '+formatTime(time)+'<br>다시 출격하면 경험치·폭탄·강화가 초기화됩니다.</p><button class="primary" id="restart">다시 출격 →</button>');$('restart').onclick=start}
function formatTime(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function update(dt){time+=dt;player.inv=Math.max(0,player.inv-dt);let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=(keys.KeyW?1:0)-(keys.KeyS?1:0),len=Math.hypot(dx,dz)||1;player.x+=dx/len*CONFIG.speed*dt;player.z+=dz/len*CONFIG.speed*dt;$('speed').textContent=dx||dz?'THRUST ACTIVE':'ENGINE IDLE';spawnClock-=dt;if(spawnClock<=0){spawnClock=Math.max(.35,1.25-time*.0025);if(enemies.length<75)spawn()}

if(e.shooter||e.boss){e.fire=(e.fire??2)-dt;if(e.fire<=0&&d<48&&visible(e)){enemyFire(e);e.fire=e.boss?2:2.6}if(d>=48||!visible(e))e.fire=Math.max(.8,e.fire)} if(d<e.r+1&&player.inv<=0){player.hp-=e.boss?24:10;player.inv=.75;hurt=.45;notify('접촉 피해 · 거리를 벌리세요');if(player.hp<=0){player.hp=0;end(false);return}}if(d>100&&!e.boss){e.x=player.x+(e.x-player.x)*.5;e.z=player.z+(e.z-player.z)*.5}}
updateBullets(dt);if(state!=='play'){hud();return}shotClock-=dt;if(shotClock<=0){let target=null,best=CONFIG.range;for(const e of enemies){let d=Math.hypot(e.x-player.x,e.z-player.z);if(d<best){best=d;target=e}}if(target){effects.push({type:'laser',x:target.x,z:target.z,t:.12});hit(target,player.damage);shotClock=player.interval}}
for(let i=drops.length-1;i>=0;i--)if(Math.hypot(drops[i].x-player.x,drops[i].z-player.z)<3){player.bombs++;drops.splice(i,1);notify('폭탄 획득 · SPACE로 사용')}
if(state==='play'&&player.xp>=player.next)levelup();hud()}
function hud(){if(!player)return;$('hptext').textContent=Math.ceil(player.hp)+' / '+player.maxhp;$('hpbar').style.width=player.hp/player.maxhp*100+'%';$('xptext').textContent=player.xp+' / '+player.next+' XP';$('xpbar').style.width=Math.min(100,player.xp/player.next*100)+'%';$('lv').textContent='LV. '+String(player.level).padStart(2,'0');$('score').textContent=String(player.total).padStart(4,'0');$('bombs').textContent=player.bombs;$('time').textContent=formatTime(time);$('mission').innerHTML='SECTOR 0'+Math.min(3,stage+1)+' <span>'+(boss?'보스를 처치하세요':stage<3?'보스 접근까지 잡몹 '+Math.max(0,CONFIG.bossAt[stage]-kills)+'기':'임무 완료')+'</span>';$('bossHud').hidden=!boss;if(boss){$('bossname').textContent=['SENTINEL / 중간보스 I','REAPER / 중간보스 II','OBLIVION / 최종보스'][stage];$('bossbar').style.width=Math.max(0,boss.hp/boss.maxhp*100)+'%'}}
function poly(points,fill,stroke){if(points.some(p=>!p))return;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function mesh(e){let a=e.phase+time*.6,r=e.r,verts=[[0,1.3,0],[r,0,0],[0,0,r],[-r,0,0],[0,0,-r],[0,-1,0]].map(v=>{let x=v[0]*Math.cos(a)-v[2]*Math.sin(a),z=v[0]*Math.sin(a)+v[2]*Math.cos(a);return project(e.x+x,.65+v[1]*r*.7,e.z+z)});let faces=[[0,1,2],[0,2,3],[0,3,4],[0,4,1],[5,2,1],[5,3,2],[5,4,3],[5,1,4]];faces.sort((a,b)=>b.reduce((s,i)=>s+(verts[i]?.z||0),0)-a.reduce((s,i)=>s+(verts[i]?.z||0),0));faces.forEach((f,i)=>poly(f.map(i=>verts[i]),e.hit?'#e7ffff':e.boss?['#4a1743','#7a2858','#251638'][i%3]:['#173746','#31545a','#12222f'][i%3],e.boss?'#ff5a98':e.shooter?'#ff9b36':'#b5a7fd'));let p=project(e.x,.65,e.z);if(p){ctx.fillStyle=e.boss?'#ff589a':e.shooter?'#ff9b36':'#c2b7ff';ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,Math.min(20,r*p.s*.13),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(e.hp<e.maxhp){let ww=Math.min(100,r*p.s*2);ctx.fillStyle='#2c3446';ctx.fillRect(p.x-ww/2,p.y-r*p.s-8,ww,3);ctx.fillStyle='#ff9a99';ctx.fillRect(p.x-ww/2,p.y-r*p.s-8,ww*e.hp/e.maxhp,3)}}}
function draw(){ctx.fillStyle='#030914';ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(W*.55,H*.3,0,W*.55,H*.3,W*.7);g.addColorStop(0,'#18314c');g.addColorStop(.35,'#0b162c');g.addColorStop(1,'#02060e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#bbdce9';ctx.fillRect(s.x*W,s.y*H,s.r,s.r)}ctx.globalAlpha=1;
let planet=ctx.createRadialGradient(W*.75-35,H*.25-35,3,W*.75,H*.25,H*.15);planet.addColorStop(0,'#385168');planet.addColorStop(.7,'#17253f');planet.addColorStop(1,'#07101e');ctx.fillStyle=planet;ctx.beginPath();ctx.arc(W*.75,H*.25,H*.15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#729ea244';ctx.stroke();
if(!player)return;ctx.strokeStyle='#2d94a119';ctx.lineWidth=1;for(let z=Math.floor(player.z/10)*10-100;z<player.z+100;z+=10){let p=project(player.x-150,0,z),q=project(player.x+150,0,z);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}for(let x=Math.floor(player.x/10)*10-150;x<player.x+150;x+=10){let p=project(x,0,player.z-100),q=project(x,0,player.z+100);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
for(const d of drops){let p=project(d.x,.4+Math.sin(time*3)*.25,d.z);if(p){let r=Math.min(30,p.s*.55);ctx.strokeStyle='#ffd181';ctx.fillStyle='#ffc66f33';ctx.beginPath();ctx.moveTo(p.x,p.y-r);ctx.lineTo(p.x+r,p.y);ctx.lineTo(p.x,p.y+r);ctx.lineTo(p.x-r,p.y);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffe0a6';ctx.font='12px monospace';ctx.fillText('B',p.x-4,p.y+4)}}
enemies.slice().sort((a,b)=>b.z-a.z).forEach(e=>{if(visible(e))mesh(e)});
for(const e of effects){let p=project(e.x,.6,e.z);if(!p)continue;if(e.type==='laser'){ctx.strokeStyle='#9affeb';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor='#5affd4';ctx.beginPath();ctx.moveTo(W/2,H*.5);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.shadowBlur=0}else{ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,(.5-e.t)*p.s*7,0,Math.PI*2);ctx.stroke()}}
for(const e of enemies){if((e.shooter||e.boss)&&e.fire<.65&&visible(e)){let p=project(e.x,0,e.z);ctx.strokeStyle='#ffbc66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,(e.r+1.2)*p.s,0,Math.PI*2);ctx.stroke()}}
for(const b of bullets){let p=project(b.x,0,b.z);ctx.strokeStyle='#ff535c88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-b.vx*.09*p.s,p.y+b.vz*.09*p.s);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.shadowColor='#ff4545';ctx.shadowBlur=12;ctx.fillStyle='#ff6262';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(4,b.r*p.s),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff2cc';ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill()}
let pp=project(player.x,0,player.z),ss=pp.s;ctx.save();ctx.translate(pp.x,pp.y);ctx.globalAlpha=player.inv>0?.5+.5*Math.sin(time*40):1;poly([{x:0,y:-ss*1.8},{x:ss*1.3,y:ss*1.3},{x:0,y:ss*.7},{x:-ss*1.3,y:ss*1.3}],'#183e51','#8bfff1');poly([{x:0,y:-ss*1.4},{x:ss*.4,y:ss*.5},{x:-ss*.4,y:ss*.5}],'#a9fff5','#dffffb');ctx.fillStyle='#43dfff';ctx.beginPath();ctx.moveTo(-ss*.4,ss);ctx.lineTo(0,ss*(2+Math.sin(time*35)*.3));ctx.lineTo(ss*.4,ss);ctx.fill();ctx.restore();
if(flash>0){ctx.fillStyle='rgba(140,255,235,'+Math.min(.8,flash)+')';ctx.fillRect(0,0,W,H)}if(hurt>0){ctx.strokeStyle='rgba(255,45,90,'+hurt*1.8+')';ctx.lineWidth=35;ctx.strokeRect(0,0,W,H)}drawRadar()}
function drawRadar(){rc.clearRect(0,0,190,190);rc.fillStyle='#071722';rc.fillRect(0,0,190,190);rc.strokeStyle='#28505b';rc.lineWidth=1;for(let r of [30,60,88]){rc.beginPath();rc.arc(95,95,r,0,Math.PI*2);rc.stroke()}rc.beginPath();rc.moveTo(95,5);rc.lineTo(95,185);rc.moveTo(5,95);rc.lineTo(185,95);rc.stroke();rc.fillStyle='#63e8dc0c';rc.beginPath();rc.moveTo(95,95);rc.lineTo(18,8);rc.lineTo(172,8);rc.fill();for(const e of [...enemies,...drops]){let x=(e.x-player.x)*1.45,z=(e.z-player.z)*1.45;if(Math.hypot(x,z)>87)continue;rc.fillStyle=e.hp===undefined?'#ffd080':e.boss?'#ff4880':e.shooter?'#ff9b36':'#b5a7fd';let r=e.boss?5:2.5;rc.fillRect(95+x-r,95-z-r,r*2,r*2)}rc.fillStyle='#8cfff0';rc.beginPath();rc.moveTo(95,88);rc.lineTo(90,100);rc.lineTo(100,100);rc.fill()}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(state==='play'){update(dt);effects=effects.filter(e=>(e.t-=dt)>0);flash=Math.max(0,flash-dt);hurt=Math.max(0,hurt-dt);noticeClock-=dt;if(noticeClock<=0)$('notice').textContent=''}draw();requestAnimationFrame(frame)}
addEventListener('keydown',e=>{if(['Space','KeyW','KeyA','KeyS','KeyD','Escape'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&!e.repeat)pause();if(e.code==='Space'&&!e.repeat)bombUse();if(state==='play')keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});$('pause').onclick=pause;intro();requestAnimationFrame(frame);
</script></body></html>
