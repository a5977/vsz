<canvas id="space" aria-label="탑뷰 우주 전장"></canvas><div class="vignette"></div>
<header><div class="brand"><span class="logo">◈</span><div>ORBIT DRIVE<small>G90 / TOP-DOWN · V4</small></div></div><div id="mission">SECTOR 01 <span>중간보스 I를 향해</span></div><button id="pause" aria-label="일시 정지">Ⅱ <span>ESC</span></button></header>

const $=id=>document.getElementById(id),canvas=$('space'),ctx=canvas.getContext('2d'),radar=$('radar'),rc=radar.getContext('2d');
const CONFIG={speed:12,range:43,shotInterval:.48,damage:14,dropChance:.18,bombDamage:180,bossAt:[20,30,40],bossHP:[230,400,650]};
let bossProgress=0,stick={x:0,z:0},lastDirection={x:0,z:1};
let camera={x:0,z:0},heading=0;
let W=innerWidth,H=innerHeight,F=H*.85,keys={},state='intro',player,enemies=[],bullets=[],drops=[],effects=[],stars=[],time=0,spawnClock=0,shotClock=0,stage=0,kills=0,boss=null,flash=0,hurt=0,noticeClock=0,last=0;
function resize(){W=innerWidth;H=innerHeight;F=H*.85;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
for(let i=0;i<280;i++)stars.push({x:Math.random(),y:Math.random()*.86,r:Math.random()*1.4+.2,a:Math.random()*.7+.2});
function notify(t){$('notice').textContent=t;noticeClock=3}
function modal(html){$('overlay').hidden=false;$('modal').innerHTML=html}
function intro(){modal('<div class="eyebrow">G90 / ORBIT SURVIVAL · V4</div><h1>ORBIT<br>DRIVE<span style="color:#73f7e8">.</span></h1><p class="intro">다가오는 적을 피하고, 성장하고, 끝내 살아남으세요.</p><p>중간보스 2마리와 최종보스를 격파하세요.<br>차량은 멈추지 않고 마지막 입력 방향으로 주행합니다.<br>주황색 적의 발사 예고를 보고 붉은 탄환을 피하세요.</p><div class="instructions"><span><kbd>W A S D</kbd> 방향 전환</span><span>자동 조준 · 자동 사격</span><span><kbd>SPACE</kbd> 폭탄</span></div><button class="primary" id="start">출격하기 →</button><p style="font-size:10px">키보드 / 터치 조이스틱 · 자동 주행 · V4 · 파괴 시 성장 초기화</p>');$('start').onclick=start}
function start(){bossProgress=0;stick={x:0,z:0};lastDirection={x:0,z:1};camera={x:0,z:0};heading=0;player={x:0,z:0,hp:100,maxhp:100,level:1,xp:0,total:0,next:10,bombs:0,damage:CONFIG.damage,interval:CONFIG.shotInterval,range:CONFIG.range,speed:CONFIG.speed,targets:1,xpMultiplier:1,xpCarry:0,hitScale:1,inv:0};enemies=[];bullets=[];drops=[];effects=[];time=0;spawnClock=0;shotClock=0;stage=0;kills=0;boss=null;flash=0;hurt=0;keys={};state='play';$('overlay').hidden=true;notify('자동 주행 시작 · WASD 또는 조이스틱으로 방향 변경');for(let i=0;i<5;i++)spawn();hud()}
function spawn(isBoss=false){let a=Math.random()*Math.PI*2,r=37+Math.random()*12;let e={x:player.x+Math.sin(a)*r,z:player.z+Math.cos(a)*r,hp:42,maxhp:42,r:1.1,speed:6+stage*.8,phase:Math.random()*6,boss:isBoss,shooter:!isBoss&&Math.random()<.35,fire:1.6+Math.random(),hit:0};if(isBoss){e.x=player.x;e.z=player.z+40;e.hp=e.maxhp=CONFIG.bossHP[stage];e.r=3.6+stage*.5;e.speed=2.7+stage*.45;boss=e;notify(['중간보스 I · SENTINEL','중간보스 II · REAPER','최종보스 · OBLIVION'][stage]+' 접근');}if(e.shooter){e.hp=e.maxhp=28;e.speed=5+stage*.5}if(!e.boss){e.healthStep=Math.floor(time/20);e.hp=e.maxhp=e.maxhp*Math.pow(1.1,e.healthStep)}enemies.push(e)}
function field(){return {x:0,y:64,w:W>800?W-230:W,h:H-112}}
function project(x,y,z){let v=field(),scale=Math.min(v.w/100,v.h/78);return {x:v.x+v.w/2+(x-camera.x)*scale,y:v.y+v.h/2-(z-camera.z)*scale,s:scale,z:100-y}}
function visible(e){let p=project(e.x,0,e.z),r=e.r*p.s,v=field();return p.x+r>v.x&&p.x-r<v.x+v.w&&p.y+r>v.y&&p.y-r<v.y+v.h}
function enemyFire(e){let angle=Math.atan2(player.z-e.z,player.x-e.x);for(const offset of e.boss?[-.2,0,.2]:[0])bullets.push({x:e.x,z:e.z,vx:Math.cos(angle+offset)*15,vz:Math.sin(angle+offset)*15,life:5,r:.55,damage:e.boss?15:10});}
function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.z+=b.vz*dt;b.life-=dt;if(Math.hypot(b.x-player.x,b.z-player.z)<b.r+.85*player.hitScale){bullets.splice(i,1);if(player.inv<=0){player.hp=Math.max(0,player.hp-b.damage);player.inv=.6;hurt=.45;if(player.hp===0){end(false);return}}}else if(b.life<=0)bullets.splice(i,1)}}
function gain(n){let amount=n*player.xpMultiplier+player.xpCarry,earned=Math.floor(amount+1e-9);player.xpCarry=amount-earned;player.xp+=earned;player.total+=earned}
function defeat(e){if(!enemies.includes(e))return;enemies.splice(enemies.indexOf(e),1);effects.push({type:'burst',x:e.x,z:e.z,t:.5,color:e.boss?'#ff5b9b':'#ffac6f'});gain(e.boss?30:3);if(e.boss){stage++;boss=null;if(stage===3){end(true);return}notify('보스 격파 · 다음 구역 진입')}else{kills++;if(!boss&&stage<3)bossProgress=Math.min(CONFIG.bossAt[stage],bossProgress+1);if(Math.random()<CONFIG.dropChance)drops.push({x:e.x,z:e.z})}}
function hit(e,d){e.hp-=d;e.hit=.12;if(e.hp<=0)defeat(e)}
function bombUse(){if(state!=='play')return;if(!player.bombs){notify('보유 폭탄이 없습니다 · 드롭된 폭탄에 접근하세요');return}player.bombs--;flash=.65;for(const e of [...enemies])if(visible(e))hit(e,e.boss?CONFIG.bombDamage:e.hp);notify('화면 폭격 · 경험치 획득');hud()}
const UPGRADES=[{id:'damage',name:'공격력',desc:'공격력 +25%'},{id:'rate',name:'공격속도',desc:'공격속도 +20%'},{id:'heal',name:'체력회복',desc:'체력 40 회복 (최대 체력까지)'},{id:'targets',name:'타겟 +1',desc:'동시에 공격하는 적 +1'},{id:'range',name:'사거리',desc:'자동 공격 사거리 +20%'},{id:'speed',name:'이동속도',desc:'이동속도 +15%'},{id:'xp',name:'경험치 획득증가',desc:'획득 경험치 +20%'},{id:'hitbox',name:'피격 범위 감소',desc:'피격 판정 반경 −10% (탄환·접촉)'}];
let offered=[];
function levelup(){player.xp-=player.next;player.level++;player.next=Math.round(player.next*1.35+4);state='upgrade';keys={};let pool=[...UPGRADES];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}offered=pool.slice(0,3);modal('<div class="eyebrow">SYSTEM UPGRADE / LEVEL '+player.level+'</div><h2>다음 전투를 준비하세요.</h2><p>8종 중 무작위로 뽑힌 3개입니다. 하나를 선택하세요. 전투는 잠시 멈춥니다.</p><div class="choices">'+offered.map((u,i)=>'<button data-up="'+u.id+'">0'+(i+1)+' / UPGRADE<b>'+u.name+'</b><small>'+u.desc+'</small></button>').join('')+'</div>');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>choose(b.dataset.up))}
function choose(type){if(state!=='upgrade'||!offered.some(u=>u.id===type))return;if(type==='damage')player.damage*=1.25;if(type==='rate')player.interval/=1.2;if(type==='heal')player.hp=Math.min(player.maxhp,player.hp+40);if(type==='targets')player.targets++;if(type==='range')player.range*=1.2;if(type==='speed')player.speed*=1.15;if(type==='xp')player.xpMultiplier*=1.2;if(type==='hitbox')player.hitScale*=.9;offered=[];$('overlay').hidden=true;state='play';hud()}
function pause(){if(state==='play'){state='pause';keys={};modal('<div class="eyebrow">DRIVE PAUSED</div><h2>주행 일시 정지</h2><p>준비되면 다시 전장으로 돌아가세요.</p><button class="primary" id="resume">계속하기 →</button>');$('resume').onclick=pause}else if(state==='pause'){state='play';$('overlay').hidden=true}}
function end(win){state='end';keys={};modal('<div class="eyebrow">'+(win?'MISSION COMPLETE':'SIGNAL LOST')+'</div><h2>'+(win?'최종보스 격파. 임무 완료!':'차량이 파괴되었습니다.')+'</h2><p>총획득 경험치</p><div class="resultScore">'+player.total+'</div><p>처치 '+kills+' · 보스 '+stage+'/3 · 주행 '+formatTime(time)+'<br>다시 출격하면 경험치·폭탄·강화가 초기화됩니다.</p><button class="primary" id="restart">다시 출격 →</button>');$('restart').onclick=start}
function formatTime(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function scaleEnemyHealth(){let step=Math.floor(time/20);for(const e of enemies){if(e.boss)continue;let old=e.healthStep??step;if(step>old){let multiplier=Math.pow(1.1,step-old);e.hp*=multiplier;e.maxhp*=multiplier}e.healthStep=step}}
function update(dt){time+=dt;scaleEnemyHealth();player.inv=Math.max(0,player.inv-dt);let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=(keys.KeyW?1:0)-(keys.KeyS?1:0),len=Math.hypot(dx,dz)||1;if(Math.hypot(stick.x,stick.z)>.1){dx=stick.x;dz=stick.z;len=Math.hypot(dx,dz)}if(dx||dz)lastDirection={x:dx/len,z:dz/len};else{dx=lastDirection.x;dz=lastDirection.z;len=1}player.x+=dx/len*player.speed*dt;player.z+=dz/len*player.speed*dt;if(dx||dz){let target=Math.atan2(dx,dz),delta=Math.atan2(Math.sin(target-heading),Math.cos(target-heading));heading+=delta*Math.min(1,dt*14)}camera.x+=(player.x-camera.x)*Math.min(1,dt*8);camera.z+=(player.z-camera.z)*Math.min(1,dt*8);$('speed').textContent=dx||dz?'THRUST ACTIVE':'ENGINE IDLE';spawnClock-=dt;if(spawnClock<=0){spawnClock=Math.max(.35,1.25-time*.0025);if(enemies.length<75)spawn()}
if(!boss&&stage<3&&bossProgress>=CONFIG.bossAt[stage])spawn(true);
for(const e of [...enemies]){e.hit=Math.max(0,e.hit-dt);let x=player.x-e.x,z=player.z-e.z,d=Math.hypot(x,z);let move=e.shooter&&d<23?0:1;e.x+=x/(d||1)*e.speed*dt*move;e.z+=z/(d||1)*e.speed*dt*move;
if(e.shooter||e.boss){e.fire=(e.fire??2)-dt;if(e.fire<=0&&d<48&&visible(e)){enemyFire(e);e.fire=e.boss?2:2.6}if(d>=48||!visible(e))e.fire=Math.max(.8,e.fire)} if(d<e.r+player.hitScale&&player.inv<=0){player.hp-=e.boss?24:10;player.inv=.75;hurt=.45;notify('접촉 피해 · 거리를 벌리세요');if(player.hp<=0){player.hp=0;end(false);return}}if(d>100&&!e.boss){e.x=player.x+(e.x-player.x)*.5;e.z=player.z+(e.z-player.z)*.5}}
updateBullets(dt);if(state!=='play'){hud();return}shotClock-=dt;if(shotClock<=0){let targets=enemies.filter(e=>Math.hypot(e.x-player.x,e.z-player.z)<=player.range).sort((a,b)=>Math.hypot(a.x-player.x,a.z-player.z)-Math.hypot(b.x-player.x,b.z-player.z)).slice(0,player.targets);if(targets.length){for(const target of targets){if(state!=='play')break;effects.push({type:'laser',x:target.x,z:target.z,t:.12});hit(target,player.damage)}shotClock=player.interval}}
for(let i=drops.length-1;i>=0;i--)if(Math.hypot(drops[i].x-player.x,drops[i].z-player.z)<3){player.bombs++;drops.splice(i,1);notify('폭탄 획득 · SPACE로 사용')}
if(state==='play'&&player.xp>=player.next)levelup();hud()}
function hud(){if(!player)return;$('hptext').textContent=Math.ceil(player.hp)+' / '+player.maxhp;$('hpbar').style.width=player.hp/player.maxhp*100+'%';$('xptext').textContent=player.xp+' / '+player.next+' XP';$('xpbar').style.width=Math.min(100,player.xp/player.next*100)+'%';$('lv').textContent='LV. '+String(player.level).padStart(2,'0');$('score').textContent=String(player.total).padStart(4,'0');$('bombs').textContent=player.bombs;$('time').textContent=formatTime(time);$('mission').innerHTML='SECTOR 0'+Math.min(3,stage+1)+' <span>'+(boss?'보스 전투 · 카운트 정지 ('+bossProgress+')':stage<3?'보스 접근까지 잡몹 '+Math.max(0,CONFIG.bossAt[stage]-bossProgress)+'기':'임무 완료')+'</span>';$('bossHud').hidden=!boss;if(boss){$('bossname').textContent=['SENTINEL / 중간보스 I','REAPER / 중간보스 II','OBLIVION / 최종보스'][stage];$('bossbar').style.width=Math.max(0,boss.hp/boss.maxhp*100)+'%'}}
function poly(points,fill,stroke){if(points.some(p=>!p))return;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function drawCar(){let p=project(player.x,0,player.z),u=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(heading);ctx.globalAlpha=player.inv>0?.65+.35*Math.cos(time*40):1;
ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillStyle='#080b10';ctx.fillRect(-1.1*u,-2.1*u,2.2*u,4.4*u);ctx.shadowBlur=0;
// Long sedan body, chrome shoulders, dark panoramic roof and twin-line lamps.
poly([{x:-u,y:-2.2*u},{x:-.7*u,y:-2.65*u},{x:.7*u,y:-2.65*u},{x:u,y:-2.2*u},{x:1.05*u,y:1.8*u},{x:.8*u,y:2.4*u},{x:-.8*u,y:2.4*u},{x:-1.05*u,y:1.8*u}],'#c5ced4','#f4f8fc');
ctx.fillStyle='#536674';ctx.fillRect(-.82*u,-1.05*u,1.64*u,2.4*u);poly([{x:-.82*u,y:-1.05*u},{x:.82*u,y:-1.05*u},{x:.64*u,y:-.25*u},{x:-.64*u,y:-.25*u}],'#142630','#87b6c6');ctx.fillStyle='#233440';ctx.fillRect(-.64*u,-.2*u,1.28*u,1.05*u);ctx.fillStyle='#122533';ctx.fillRect(-.72*u,.95*u,1.44*u,.5*u);
ctx.fillStyle='#e9ffff';for(let x of [-.9,.32])for(let y of [-2.25,-2.08])ctx.fillRect(x*u,y*u,.58*u,.09*u);ctx.fillStyle='#ff435e';for(let x of [-.9,.32])for(let y of [1.94,2.1])ctx.fillRect(x*u,y*u,.58*u,.09*u);ctx.strokeStyle='#7e8d96';ctx.strokeRect(-.7*u,-1.85*u,1.4*u,.65*u);ctx.fillStyle='#ecffff';ctx.font='bold '+Math.max(6,u*.6)+'px sans-serif';ctx.textAlign='center';ctx.fillText('G90',0,.5*u);ctx.restore();
ctx.strokeStyle='#71ebdc55';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,.85*player.hitScale*u,0,Math.PI*2);ctx.stroke();}
function mesh(e){let p=project(e.x,0,e.z),u=Math.max(9,p.s*e.r),color=e.boss?'#ff5f9f':e.shooter?'#ffa54f':'#78dfd1';ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor=color;ctx.shadowBlur=8;ctx.fillStyle=e.hit?'#fff':'#243546';ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,2,u*1.25,u*.68,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=e.hit?'#fff':'#7b98a9';ctx.beginPath();ctx.ellipse(0,-u*.1,u*1.12,u*.5,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=e.boss?'#922d74':e.shooter?'#c97938':'#2b9c9c';ctx.beginPath();ctx.ellipse(0,-u*.25,u*.52,u*.48,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#dfffff99';ctx.beginPath();ctx.ellipse(-u*.15,-u*.42,u*.17,u*.09,-.4,0,Math.PI*2);ctx.fill();for(let i=0;i<6;i++){let a=i*Math.PI/3+time;ctx.fillStyle=color;ctx.beginPath();ctx.arc(Math.cos(a)*u*.87,Math.sin(a)*u*.34+2,Math.max(1.5,u*.1),0,Math.PI*2);ctx.fill()}ctx.restore();if(e.hp<e.maxhp){ctx.fillStyle='#1a2632';ctx.fillRect(p.x-u,p.y-u-8,u*2,3);ctx.fillStyle=color;ctx.fillRect(p.x-u,p.y-u-8,u*2*e.hp/e.maxhp,3)}if((e.shooter||e.boss)&&e.fire<.65){ctx.strokeStyle='#ffbd5b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,u*1.4,0,Math.PI*2);ctx.stroke()}}
function draw(){ctx.fillStyle='#060c16';ctx.fillRect(0,0,W,H);let v=field();ctx.save();ctx.beginPath();ctx.rect(v.x,v.y,v.w,v.h);ctx.clip();let g=ctx.createRadialGradient(v.w*.4,H*.4,0,v.w*.4,H*.4,W*.7);g.addColorStop(0,'#142b37');g.addColorStop(1,'#060a16');ctx.fillStyle=g;ctx.fillRect(v.x,v.y,v.w,v.h);for(const star of stars){let x=((star.x*v.w-camera.x*.4)%v.w+v.w)%v.w,y=((star.y*v.h+camera.z*.4)%v.h+v.h)%v.h+v.y;ctx.globalAlpha=star.a;ctx.fillStyle='#bcdbe4';ctx.fillRect(x,y,star.r,star.r)}ctx.globalAlpha=1;if(!player){ctx.restore();return}
ctx.strokeStyle='#36667422';ctx.lineWidth=1;for(let x=Math.floor(camera.x/10)*10-150;x<camera.x+150;x+=10){let p=project(x,0,camera.z);ctx.beginPath();ctx.moveTo(p.x,v.y);ctx.lineTo(p.x,v.y+v.h);ctx.stroke()}for(let z=Math.floor(camera.z/10)*10-100;z<camera.z+100;z+=10){let p=project(camera.x,0,z);ctx.beginPath();ctx.moveTo(v.x,p.y);ctx.lineTo(v.w,p.y);ctx.stroke()}
for(const d of drops){let p=project(d.x,0,d.z);ctx.fillStyle='#edbc60';ctx.strokeStyle='#ffe2a1';ctx.fillRect(p.x-6,p.y-6,12,12);ctx.strokeRect(p.x-9,p.y-9,18,18);ctx.fillStyle='#1c2330';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('B',p.x,p.y+4)}
for(const e of enemies)if(visible(e))mesh(e);
for(const e of effects){let p=project(e.x,0,e.z);if(e.type==='laser'){let origin=project(player.x,0,player.z);ctx.strokeStyle='#8bfff0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(p.x,p.y);ctx.stroke()}else{ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,(.5-e.t)*p.s*7,0,Math.PI*2);ctx.stroke()}}
drawCar();for(const b of bullets){let p=project(b.x,0,b.z);ctx.strokeStyle='#ff535c88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-b.vx*.13*p.s,p.y+b.vz*.13*p.s);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.shadowColor='#ff4545';ctx.shadowBlur=10;ctx.fillStyle='#ff6b66';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(4,b.r*p.s),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff1bf';ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,Math.PI*2);ctx.fill()}
if(flash>0){ctx.fillStyle='rgba(140,255,235,'+Math.min(.8,flash)+')';ctx.fillRect(0,0,W,H)}if(hurt>0){ctx.strokeStyle='rgba(255,45,90,'+hurt*1.8+')';ctx.lineWidth=18;ctx.strokeRect(v.x,v.y,v.w,v.h)}ctx.restore();drawRadar()}
function drawRadar(){rc.clearRect(0,0,190,190);rc.fillStyle='#071722';rc.fillRect(0,0,190,190);rc.strokeStyle='#28505b';rc.lineWidth=1;for(let r of [30,60,88]){rc.beginPath();rc.arc(95,95,r,0,Math.PI*2);rc.stroke()}rc.beginPath();rc.moveTo(95,5);rc.lineTo(95,185);rc.moveTo(5,95);rc.lineTo(185,95);rc.stroke();rc.fillStyle='#63e8dc0c';rc.beginPath();rc.moveTo(95,95);rc.lineTo(18,8);rc.lineTo(172,8);rc.fill();for(const e of [...enemies,...drops]){let x=(e.x-player.x)*1.45,z=(e.z-player.z)*1.45;if(Math.hypot(x,z)>87)continue;rc.fillStyle=e.hp===undefined?'#ffd080':e.boss?'#ff4880':e.shooter?'#ff9b36':'#b5a7fd';let r=e.boss?5:2.5;rc.fillRect(95+x-r,95-z-r,r*2,r*2)}rc.fillStyle='#8cfff0';rc.beginPath();rc.moveTo(95,88);rc.lineTo(90,100);rc.lineTo(100,100);rc.fill()}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(state==='play'){update(dt);effects=effects.filter(e=>(e.t-=dt)>0);flash=Math.max(0,flash-dt);hurt=Math.max(0,hurt-dt);noticeClock-=dt;if(noticeClock<=0)$('notice').textContent=''}draw();requestAnimationFrame(frame)}
addEventListener('keydown',e=>{if(['Space','KeyW','KeyA','KeyS','KeyD','Escape'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&!e.repeat)pause();if(e.code==='Space'&&!e.repeat)bombUse();if(state==='play')keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});$('pause').onclick=pause;intro();requestAnimationFrame(frame);

const joystick=$('joystick'),knob=$('knob');let activePointer=null;
function steer(e){let r=joystick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.35),z=-(e.clientY-r.top-r.height/2)/(r.height*.35),length=Math.hypot(x,z);stick={x:x/Math.max(1,length),z:z/Math.max(1,length)};knob.style.transform='translate('+stick.x*36+'px,'+(-stick.z*36)+'px)'}
joystick.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;joystick.setPointerCapture(e.pointerId);steer(e)});joystick.addEventListener('pointermove',e=>{if(activePointer===e.pointerId)steer(e)});function release(e){if(e.pointerId!==activePointer)return;activePointer=null;stick={x:0,z:0};knob.style.transform='translate(0,0)'}joystick.addEventListener('pointerup',release);joystick.addEventListener('pointercancel',release);joystick.addEventListener('lostpointercapture',release);$('touchBomb').addEventListener('click',bombUse);addEventListener('blur',()=>{stick={x:0,z:0};activePointer=null;knob.style.transform='translate(0,0)'});
