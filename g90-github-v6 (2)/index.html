<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT DRIVE — G90 서바이벌</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="space" aria-label="탑뷰 우주 전장"></canvas><div class="vignette"></div>
<header><div class="brand"><span class="logo">◈</span><div>ORBIT DRIVE<small>G90 / TOP-DOWN · V6</small></div></div><div id="mission">SECTOR 01 <span>중간보스 I를 향해</span></div><button id="sound" aria-label="배경 음악 켜기 끄기">▶ 음악 켜기</button><button id="pause" aria-label="일시 정지">Ⅱ <span>ESC</span></button></header>
<section class="stats"><div><label>차량 내구도 <b id="hptext">100 / 100</b></label><div class="bar"><i id="hpbar"></i></div></div><div class="xp"><label><span id="lv">LV. 01</span><b id="xptext">0 / 10 XP</b></label><div class="bar"><i id="xpbar"></i></div></div></section>
<section id="bossHud" hidden><label id="bossname"></label><div class="bar"><i id="bossbar"></i></div></section>
<aside class="radar"><div>주변 탐지 <span>60m</span></div><canvas id="radar" width="190" height="190"></canvas><small><i></i> 일반 적 <i class="red"></i> 보스 <i class="gold"></i> 폭탄</small></aside>
<div id="notice" role="status"></div>
<div class="cockpit"><div class="dashboard"><div><small>총획득 경험치</small><strong id="score">0000</strong></div><div class="drive"><span>▲</span><small>G90 · 자동 공격</small><b id="speed">ENGINE READY</b></div><div><small>화면 폭탄</small><strong><kbd>SPACE</kbd> × <span id="bombs">0</span></strong></div></div></div>
<footer><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 평면 이동</span><span><kbd>SPACE</kbd> 폭탄</span><span><kbd>ESC</kbd> 일시 정지</span><span class="time" id="time">00:00</span></footer>
<div class="touch-controls"><button id="touchBomb" aria-label="폭탄 사용">폭탄</button><div id="joystick" role="group" aria-label="이동 방향 조이스틱"><span id="knob"></span></div></div><div id="overlay"><div class="modal" id="modal"></div></div><script src="game.js"></script></body></html>
